<section style="font-family: 'Montserrat', sans-serif; text-align: center; padding: 10px 14px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; max-width: 1000px; margin: 0 auto;">

    <div style="flex: 1 1 380px; background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); padding: 30px; text-align: left;">
      <h3 style="color: #062659; font-size: 20px; margin-bottom: 20px;">Get in Touch</h3>

      <form id="sdgContactForm">
        <label style="display:block; font-weight:600; color:#062659; margin-bottom:6px;">Full Name</label>
        <input id="fullName" type="text" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">

        <label style="display:block; font-weight:600; color:#062659; margin-bottom:6px;">Company / Organization</label>
        <input id="company" type="text" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">

        <label style="display:block; font-weight:600; color:#062659; margin-bottom:6px;">Email Address</label>
        <input id="email" type="email" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">

        <label style="display:block; font-weight:600; color:#062659; margin-bottom:6px;">Type of Inquiry</label>
        <select id="inquiry" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">
          <option>Freight Services</option>
          <option>Partnership / Collaboration</option>
          <option>Other</option>
        </select>

        <label style="display:block; font-weight:600; color:#062659; margin-bottom:6px;">Message</label>
        <textarea id="message" rows="4" required style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc; border-radius:6px;"></textarea>

        <button id="submitBtn" type="submit" style="background-color:#37a053; color:white; padding:12px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:600; width:100%; transition: all 0.3s;">
          Send Message
        </button>

        <div id="formStatus" style="margin-top:10px; font-size:13px; color:#333; min-height:18px;"></div>
      </form>
<script>
  (function () {
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMwJa6JwT3J7t4Tm9hLZmTrqLAG0XD-78xu9OFFhtsa7fxydxHBsUa864Iut-xrUJh0g/exec";

    const form = document.getElementById("sdgContactForm");
    const statusEl = document.getElementById("formStatus");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      statusEl.textContent = "Sending...";
      btn.disabled = true;
      btn.style.opacity = "0.8";
      btn.style.cursor = "not-allowed";

      const payload = {
        fullName: document.getElementById("fullName").value.trim(),
        company: document.getElementById("company").value.trim(),
        email: document.getElementById("email").value.trim(),
        inquiry: document.getElementById("inquiry").value,
        message: document.getElementById("message").value.trim(),
        source: window.location.href
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        // Con no-cors no podemos leer respuesta, pero el POST se envía igual
        statusEl.textContent = "✅ Thank you for contacting us. We have received your message and will review it shortly.";
        form.reset();

      } catch (err) {
        statusEl.textContent = "❌ Something went wrong. Please try again later.";
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
      }
    });
  })();
      </script>
    </div>
  </div>
</section>
