name: Deploy preview to GitHub Pages

# Manual only. The first deployment is a preview and needs owner approval (brief §18).
# Requires Settings → Pages → Source: GitHub Actions (public repository, free plan).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NEXT_PUBLIC_BASE_PATH: /sdg-railway-website
      NEXT_PUBLIC_SITE_URL: https://portvirtuallab.github.io/sdg-railway-website
      # Apps Script web app URL (Settings → Secrets and variables → Actions → Variables).
      # Empty: the site runs in demo mode (quotes kept in each browser).
      NEXT_PUBLIC_QUOTE_API_URL: ${{ vars.QUOTE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Static pages start from the current Sheet; the browser then reads it live.
      - name: Refresh the Sheet snapshot
        if: env.NEXT_PUBLIC_QUOTE_API_URL != ''
        continue-on-error: true
        run: npm run sheet:snapshot -- --url "$NEXT_PUBLIC_QUOTE_API_URL"
      - run: npm run build
      - run: node scripts/check-links.mjs out "$NEXT_PUBLIC_BASE_PATH"
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
