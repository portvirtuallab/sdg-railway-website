name: Bug report
description: Something on the website does not work as expected
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: /services/railway-equipment-fleet/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android phone, Chrome
  - type: dropdown
    id: role
    attributes:
      label: You are a
      options: [Learner, Trainer, Content editor, Developer, Other]
